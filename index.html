<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>احسبلي - حاسبة أجرة الميكروباص</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen flex flex-col bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-cairo">

  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <div class="mx-auto flex max-w-md items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-800 text-white">
          <i class="fa-solid fa-van-shuttle text-xl"></i>
        </div>

        <div>
          <h1 class="text-xl font-black text-amber-500">
            احسبلي <span class="text-xs font-normal text-slate-500">e7sbly</span>
          </h1>
          <p class="text-[10px] text-slate-500">made with Love by Youssef </p>
        </div>
      </div>

      <div class="flex gap-2">
        <button
          type="button"
          onclick="toggleTheme()"
          aria-label="تغيير المظهر"
          class="btn-active rounded-xl border border-slate-300 bg-slate-100 px-3 py-2 dark:border-slate-700 dark:bg-slate-800"
        >
          <i id="themeIcon" class="fa-solid fa-moon text-amber-400"></i>
        </button>

        <button
          type="button"
          onclick="resetTrip()"
          class="btn-active rounded-xl border border-rose-500/20 bg-rose-500/10 px-3 py-2 text-xs font-bold text-rose-600 dark:text-rose-400"
        >
          <i class="fa-solid fa-rotate-right"></i>
          رحلة جديدة
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-md flex-grow space-y-5 p-4">

    <section class="space-y-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <div class="grid grid-cols-2 gap-3">
        <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 dark:border-slate-800 dark:bg-slate-950">
          <label for="fareInput" class="mb-1 block text-xs font-bold text-slate-500 dark:text-slate-400">
            أجرة الفرد (جنيه)
          </label>
          <input
            id="fareInput"
            type="number"
            min="0"
            step="0.5"
            value="7"
            oninput="updateTripCalculations()"
            class="w-full bg-transparent text-2xl font-extrabold text-amber-600 focus:outline-none dark:text-amber-400"
          >
        </div>

        <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 dark:border-slate-800 dark:bg-slate-950">
          <label for="passengersCount" class="mb-1 block text-xs font-bold text-slate-500 dark:text-slate-400">
            عدد ركاب الميكروباص
          </label>
          <select
            id="passengersCount"
            onchange="updateTripCalculations()"
            class="w-full cursor-pointer bg-transparent text-sm font-extrabold focus:outline-none dark:text-white"
          >
            <option value="14">14 فرد (العادي)</option>
            <option value="11">11 فرد (تويوتا قصير)</option>
            <option value="8">8 ركاب (ثمنيات)</option>
            <option value="15">15 فرد (سقف عالي)</option>
            <option value="12">12 فرد</option>
          </select>
        </div>
      </div>

      <div>
        <p class="mb-2 text-xs font-bold text-slate-500 dark:text-slate-400">
          اختيار سريع للأجرة:
        </p>
        <div class="flex flex-wrap gap-2">
          <button type="button" onclick="setFare(3.5)" class="btn-active rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold dark:bg-slate-800">3.5</button>
          <button type="button" onclick="setFare(5)" class="btn-active rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold dark:bg-slate-800">5</button>
          <button type="button" onclick="setFare(7)" class="btn-active rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold dark:bg-slate-800">7</button>
          <button type="button" onclick="setFare(8.5)" class="btn-active rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold dark:bg-slate-800">8.5</button>
          <button type="button" onclick="setFare(10)" class="btn-active rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold dark:bg-slate-800">10</button>
          <button type="button" onclick="setFare(12)" class="btn-active rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold dark:bg-slate-800">12</button>
          <button type="button" onclick="setFare(15)" class="btn-active rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold dark:bg-slate-800">15</button>
        </div>
      </div>

      <div class="space-y-3 border-t border-slate-200 pt-3 dark:border-slate-800">
        <div class="flex items-end justify-between">
          <div>
            <span class="block text-xs text-slate-500 dark:text-slate-400">المُحصّل حتى الآن</span>
            <div class="text-2xl font-black text-emerald-600 dark:text-emerald-400">
              <span id="collectedMoney">0</span>
              <span class="text-xs font-normal text-slate-500">جنيه</span>
            </div>
          </div>

          <div class="text-left">
            <span class="block text-xs text-slate-500 dark:text-slate-400">الركاب الدفعين</span>
            <div class="text-xl font-extrabold">
              <span id="paidPassengers">0</span> /
              <span id="totalPassengersDisplay">14</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="space-y-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="font-bold">
        <i class="fa-solid fa-calculator text-amber-500"></i>
        حاسبة الباقي والتحصيل
      </h2>

      <div>
        <label class="mb-2 block text-xs font-bold text-slate-500 dark:text-slate-400">
          1. الفلوس المستلمة (الورقة):
        </label>

        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="selectBill(200)" data-bill="200" class="bill-button btn-active rounded-xl border border-slate-200 bg-slate-100 p-2.5 text-lg font-black dark:border-slate-800 dark:bg-slate-950">200</button>
          <button type="button" onclick="selectBill(100)" data-bill="100" class="bill-button btn-active rounded-xl border border-slate-200 bg-slate-100 p-2.5 text-lg font-black dark:border-slate-800 dark:bg-slate-950">100</button>
          <button type="button" onclick="selectBill(50)" data-bill="50" class="bill-button btn-active rounded-xl border border-slate-200 bg-slate-100 p-2.5 text-lg font-black dark:border-slate-800 dark:bg-slate-950">50</button>
          <button type="button" onclick="selectBill(20)" data-bill="20" class="bill-button btn-active rounded-xl border border-slate-200 bg-slate-100 p-2.5 text-lg font-black dark:border-slate-800 dark:bg-slate-950">20</button>
          <button type="button" onclick="selectBill(10)" data-bill="10" class="bill-button btn-active rounded-xl border border-slate-200 bg-slate-100 p-2.5 text-lg font-black dark:border-slate-800 dark:bg-slate-950">10</button>
          <button type="button" onclick="selectBill(5)" data-bill="5" class="bill-button btn-active rounded-xl border border-slate-200 bg-slate-100 p-2.5 text-lg font-black dark:border-slate-800 dark:bg-slate-950">5</button>
        </div>
      </div>

      <div>
        <label class="mb-2 block text-xs font-bold text-slate-500 dark:text-slate-400">
          2. دفع عن كام فرد؟
        </label>

        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="adjustPassengerCount(-1)"
            aria-label="تقليل عدد الركاب"
            class="btn-active h-12 w-12 rounded-xl bg-slate-200 text-2xl font-black dark:bg-slate-800"
          >−</button>

          <div class="flex-1 rounded-xl border border-slate-200 bg-slate-50 py-2 text-center dark:border-slate-800 dark:bg-slate-950">
            <span id="payingPassengersCount" class="text-2xl font-black text-amber-600 dark:text-amber-400">1</span>
            <span class="block text-xs text-slate-500">راكب</span>
          </div>

          <button
            type="button"
            onclick="adjustPassengerCount(1)"
            aria-label="زيادة عدد الركاب"
            class="btn-active h-12 w-12 rounded-xl bg-slate-200 text-2xl font-black dark:bg-slate-800"
          >＋</button>
        </div>
      </div>

      <div
        id="resultContainer"
        class="space-y-2 rounded-2xl border-2 border-slate-200 bg-slate-50 p-4 text-center dark:border-slate-800 dark:bg-slate-950"
      >
        <div class="text-xs font-bold text-slate-500">الحسبة الحالية:</div>

        <div class="flex justify-around border-b border-slate-200 py-1 dark:border-slate-800">
          <div>
            <span class="block text-xs text-slate-500">المطلوب</span>
            <span id="requiredMoney" class="font-extrabold">7 ج</span>
          </div>
          <div class="text-slate-400">|</div>
          <div>
            <span class="block text-xs text-slate-500">الورقة</span>
            <span id="givenBillDisplay" class="font-extrabold">0 ج</span>
          </div>
        </div>

        <div class="pt-2">
          <span class="mb-1 block text-xs font-bold text-slate-500">الباقي للراكب:</span>
          <div id="changeAmount" class="text-4xl font-black text-emerald-600 dark:text-emerald-400">
            0 جنيه
          </div>
          <div id="changeDetails" class="mt-1 min-h-5 text-xs text-slate-500">
            اختر الورقة وحدد عدد الركاب
          </div>
        </div>
      </div>

      <button
        id="addPaymentBtn"
        type="button"
        onclick="confirmPayment()"
        disabled
        class="btn-active w-full rounded-xl bg-emerald-600 px-4 py-3 font-black text-white transition disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400 dark:disabled:bg-slate-800 dark:disabled:text-slate-500"
      >
        <i class="fa-solid fa-circle-check"></i>
       تأكبد
      </button>
    </section>
  </main>

  <footer class="mx-auto mt-2 max-w-md px-4 pb-4 text-center text-[10px] text-slate-500">
    احسبلي - e7sbly | تطبيق حساب أجرة الميكروباص
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
